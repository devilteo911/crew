name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tests/e2e.sh needs 4341dd2 and 64f4e37 in the history
      - name: shellcheck
        # ponytail: pinned image, not the runner's apt shellcheck (0.9.0 on 24.04, 0.11.0 on 26.04)
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 bin/crew install.sh tests/e2e.sh tests/plugin.sh plugins/crew/scripts/*.sh
      - name: e2e
        run: sh tests/e2e.sh
      - name: plugin scripts
        run: sh tests/plugin.sh
      - name: claude plugin validate
        run: |
          npm i -g @anthropic-ai/claude-code
          claude plugin validate --strict .
          claude plugin validate --strict plugins/crew
